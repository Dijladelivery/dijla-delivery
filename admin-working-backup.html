<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIJLA DELIVERY - Admin</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #07111f;
        color: white;
    }

    header {
        background: #0d1b2a;
        padding: 20px;
        text-align: center;
        border-bottom: 1px solid #c9a227;
    }

    header h1 {
        margin: 0;
        color: #d4af37;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
    }

    .card {
        background: #102235;
        padding: 25px;
        border-radius: 15px;
        margin-bottom: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    h2 {
        color: #d4af37;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 6px;
    }

    input,
    select {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #1b334a;
        color: white;
    }

    button {
        margin-top: 20px;
        padding: 14px 25px;
        border: none;
        border-radius: 8px;
        background: #d4af37;
        color: #07111f;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #f0cc55;
    }

    #message {
        margin-top: 20px;
        padding: 12px;
        border-radius: 8px;
    }

    .shipment {
        background: white;
        color: #111;
        margin: 15px 0;
        padding: 20px;
        border-radius: 10px;
    }

    .shipment h3 {
        margin-top: 0;
        color: #0d1b2a;
    }
</style>

</head><body><header>
    <h1>DIJLA DELIVERY</h1>
    <p>Admin Dashboard</p>
</header><div class="container"><div class="card">
    <h2>Create Shipment</h2>

    <label>Tracking Code</label>
    <input
        type="text"
        id="trackingCode"
        placeholder="Example: DIJLA1002"
    >

    <label>Sender</label>
    <input
        type="text"
        id="sender"
        placeholder="Sender name"
    >

    <label>Receiver</label>
    <input
        type="text"
        id="receiver"
        placeholder="Receiver name"
    >

    <label>Origin</label>
    <input
        type="text"
        id="origin"
        placeholder="Example: Lagos, Nigeria"
    >

    <label>Destination</label>
    <input
        type="text"
        id="destination"
        placeholder="Example: Abuja, Nigeria"
    >

    <label>Current Location</label>
    <input
        type="text"
        id="currentLocation"
        placeholder="Current package location"
    >

    <label>Status</label>
    <select id="status">
        <option>Order Received</option>
        <option>Picked Up</option>
        <option>In Transit</option>
        <option>At Destination</option>
        <option>Out for Delivery</option>
        <option>Delivered</option>
    </select>

    <label>Estimated Delivery</label>
    <input
        type="date"
        id="estimatedDelivery"
    >

    <label>Map Latitude</label>
    <input
        type="number"
        id="latitude"
        placeholder="Example: 6.5244"
        step="any"
    >

    <label>Map Longitude</label>
    <input
        type="number"
        id="longitude"
        placeholder="Example: 3.3792"
        step="any"
    >

    <button onclick="createShipment()">
        Create Shipment
    </button>

    <div id="message"></div>
</div>

<div class="card">
    <h2>All Shipments</h2>
    <div id="shipmentsList"></div>
</div>

</div><script>

async function createShipment() {

    const shipment = {
        trackingCode: document.getElementById("trackingCode").value.trim(),
        sender: document.getElementById("sender").value.trim(),
        receiver: document.getElementById("receiver").value.trim(),
        origin: document.getElementById("origin").value.trim(),
        destination: document.getElementById("destination").value.trim(),
        currentLocation: document.getElementById("currentLocation").value.trim(),
        status: document.getElementById("status").value,
        estimatedDelivery:
            document.getElementById("estimatedDelivery").value || null,

        latitude: document.getElementById("latitude").value
            ? Number(document.getElementById("latitude").value)
            : null,

        longitude: document.getElementById("longitude").value
            ? Number(document.getElementById("longitude").value)
            : null
    };

    if (!shipment.trackingCode) {
        document.getElementById("message").innerText =
            "Please enter a tracking code.";
        return;
    }

    try {

        const response = await fetch("/api/packages", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(shipment)
        });

        const data = await response.json();

        document.getElementById("message").innerText =
            data.message || "Shipment created.";

        if (response.ok) {

            document.getElementById("trackingCode").value = "";
            document.getElementById("sender").value = "";
            document.getElementById("receiver").value = "";
            document.getElementById("origin").value = "";
            document.getElementById("destination").value = "";
            document.getElementById("currentLocation").value = "";
            document.getElementById("estimatedDelivery").value = "";
            document.getElementById("latitude").value = "";
            document.getElementById("longitude").value = "";

            await loadShipments();
        }

    } catch (error) {

        console.error(error);

        document.getElementById("message").innerText =
            "Something went wrong.";
    }
}


async function loadShipments() {

    try {

        const response = await fetch("/api/packages");

        const packages = await response.json();

        const section = document.getElementById("shipmentsList");

        section.innerHTML = "";

        const shipmentList = Object.values(packages);

        if (shipmentList.length === 0) {

            section.innerHTML = "<p>No shipments found.</p>";

            return;
        }

        shipmentList.forEach(pkg => {

            const shipment = document.createElement("div");

            shipment.className = "shipment";

            shipment.innerHTML = `
                <h3>Tracking Code: ${pkg.trackingCode}</h3>

                <p><strong>Sender:</strong> ${pkg.sender || ""}</p>

                <p><strong>Receiver:</strong> ${pkg.receiver || ""}</p>

                <p><strong>Origin:</strong> ${pkg.origin || ""}</p>

                <p><strong>Destination:</strong> ${pkg.destination || ""}</p>

                <p><strong>Current Location:</strong> ${pkg.currentLocation || ""}</p>

                <p><strong>Status:</strong> ${pkg.status || ""}</p>

                <p><strong>Estimated Delivery:</strong> ${pkg.estimatedDelivery || "Not set"}</p>

                <p><strong>Latitude:</strong> ${pkg.latitude ?? "Not set"}</p>

                <p><strong>Longitude:</strong> ${pkg.longitude ?? "Not set"}</p>
            `;

            section.appendChild(shipment);
        });

    } catch (error) {

        console.error("Error loading shipments:", error);

        document.getElementById("shipmentsList").innerHTML =
            "<p>Unable to load shipments.</p>";
    }
}


loadShipments();

</script></body>
</html>
